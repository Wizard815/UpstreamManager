[project]
name = "upstream-upkeep"
version = "0.1.0"
description = "Studio connector that keeps local repos in sync with upstreams and recent changes, with daily checks, approval-gated pushes, per-repo chat with memory and daily logs, and an LLM settings page sharing the same backend as Studio."
readme = "README.md"
authors = [
    { name = "Wizard815", email = "fellasnetwork815@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "keyring>=25.7.0",
    "mcp>=2.3,<3",
    "pynacl>=1.6.2",
    "pyyaml>=6.0.3",
    "requests>=2.31",
    "waitress>=3.0.2",
]

[project.scripts]
upstream-manager = "upstream_upkeep.run:main"
upstream-mcp = "upstream_upkeep.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
